function completeDemoMatches(tid){

  const score=(m,i)=>{if(m.sh!=null||m.bye||!m.home||!m.away||m.home==='BYE'||m.away==='BYE')return;const win=(i%3===0);m.sh=win?3:1;m.sa=win?1:3};

  else if(t.format==='rr'){
    S.matches.filter(m=>m.tid===tid&&!m.br).forEach(score);
    syncGroupPlayoff(tid);
    for(let k=0;k<12;k++){const pending=S.matches.filter(m=>m.tid===tid&&m.br==='W'&&m.home&&m.away&&m.sh==null);if(!pending.length)break;pending.sort((a,b)=>a.round-b.round).forEach((m,i)=>score(m,i));resolve(tid)}
  }else if(t.format==='swiss'){

    for(let r=1;r<=tRounds;r++){
      S.matches.filter(m=>m.tid===tid&&m.round===r).forEach((m,i)=>score(m,i));
      if(r<tRounds)addRound(t,r+1);
    }
  }else{
    for(let k=0;k<24;k++){
      resolve(tid);let pending=S.matches.filter(m=>m.tid===tid&&m.sh==null&&!m.bye&&m.home&&m.away&&m.home!=='BYE'&&m.away!=='BYE');
      if(!pending.length)break;
      pending.sort((a,b)=>(a.stage||a.round)-(b.stage||b.round)||a.round-b.round||a.pos-b.pos).forEach((m,i)=>score(m,i));resolve(tid);
    }
  }
}

  const fn=A[el.dataset.a];if(fn){const action=el.dataset.a,need=({newT:'t',delT:'t',editT:'t',newTeam:'team',editTeam:'team',delTeam:'team',newMember:'ath',newAth:'ath',editAth:'ath',delAth:'ath',addAthAccount:'user',draw:'draw',edit:'score',ev:'score',delEv:'score',newVenue:'res',delVenue:'res',newRef:'res',delRef:'res',newUser:'user',delUser:'user',rules:'t'})[action];if(!['logout','go','openT','selTeam'].includes(action)&&(!need||!can(need)))return;if(action==='delUser'){deleteUserAccount(el.dataset.id);return}fn(el.dataset.id);render()}
});
document.addEventListener('change',e=>{

  if(c==='urole'){if(can('user'))S.users.find(u=>u.id===el.dataset.id).role=el.value}

async function connectDatabase(){
  try{
    const response=await fetch('/api/state',{cache:'no-store'});
    if(response.status===401){const status=await fetch('/api/bootstrap-status',{cache:'no-store'});const setup=await status.json();S=null;DB_READY=false;renderAuth(setup.setupRequired);return}
    if(!response.ok)throw new Error('PostgreSQL API không phản hồi');
    activateSession(await response.json());
  }catch(error){
    console.error('Không kết nối PostgreSQL:',error);
    $('#app').innerHTML=`<main class="body" style="max-width:560px;margin:12vh auto"><div class="card"><div class="logo">Giải đấu</div><h1>Chưa kết nối PostgreSQL</h1><p class="mut">${esc(error.message)}<br>Kiểm tra dịch vụ PostgreSQL và file .env, sau đó khởi động lại bằng <b>npm start</b>.</p></div></main>`;
  }
}
connectDatabase();
